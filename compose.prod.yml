services:
  gateway:
    image: nginx:alpine
    ports:
      # Public interface is closed by the DigitalOcean firewall; this port is
      # reachable only through Tailscale (tailscale0).
      - "80:80"
    volumes:
      - ./gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api
    restart: unless-stopped

  web:
    image: evaristor/recurrator.web:latest
    expose:
      - "80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  api:
    image: evaristor/recurrator:latest
    command: uvicorn recurrator.api:app --host 0.0.0.0 --port 8000
    expose:
      - "8000"
    volumes:
      - /root/.config/recurrator:/root/.config/recurrator
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/openapi.json')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
