services:
  api:
    image: evaristor/recurrator:latest
    command: uvicorn recurrator.api:app --host 0.0.0.0 --port 8000
    ports:
      # Public interface is closed by the DigitalOcean firewall; this port is
      # reachable only through Tailscale (tailscale0).
      - "8000:8000"
    volumes:
      - /root/.config/recurrator:/root/.config/recurrator
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  cli:
    image: evaristor/recurrator:latest
    command: sleep infinity
    stdin_open: true
    tty: true
    volumes:
      - /root/.config/recurrator:/root/.config/recurrator
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
